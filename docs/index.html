const LEVELS=[
{title:'أنت داخل الصورة',en:'Meet the pixel',icon:'grid',world:0,source:'S07-S09',lab:'pixels',recap:'البكسل له موقع وقيمة. أخذ العينات يحدد المواقع، والتكميم يحدد القيم.',steps:[
C('pixel','الصورة شبكة أرقام','Pixel & Matrix','كل مربع صغير هو بكسل. موقعه صف وعمود، وقيمته تعبّر عن شدته. اضغط على مربع في المختبر لترى الفرق بين الموقع والقيمة.','I(r,c) = intensity','قد يكون الموقع (1,2) وقيمته 200. الرقم 200 ليس رقم الصف أو العمود.',[mc('ما أصغر وحدة في الصورة الرقمية؟',['البكسل Pixel','الملف File','الحزمة Band'],0,'البكسل عنصر واحد في شبكة الصورة؛ الحزمة تضم شبكة كاملة.'),mc('في I(2,3)=180، ماذا يعني 180؟',['قيمة البكسل','عدد الأعمدة','رقم الصف'],0,'(2,3) هو الموقع؛ 180 هي الشدة في ذلك الموقع.')]),
C('matrix','احسب المربعات','Rows × Columns','عدد البكسلات يساوي عدد الصفوف مضروباً في عدد الأعمدة. اكتب دائماً: صفوف × أعمدة، ولا تعتمد على شكل المستطيل فقط.','pixels = R × C','مصفوفة من 3 صفوف و4 أعمدة تحتوي 12 بكسلاً.',[num('شبكة من 3 صفوف و4 أعمدة. كم بكسلاً؟',12,'بكسل','3×4=12. الصف والعمود يحددان المواقع.'),num('شبكة من 5 صفوف و6 أعمدة. كم بكسلاً؟',30,'بكسل','5×6=30.')]),
C('sampling','أين؟ أم كم شدة؟','Sampling vs Quantization','Sampling يحدد أين نأخذ القياسات على شبكة الصورة. Quantization يحدد القيم المسموح بها للشدة. عدد المواقع وعمق القيمة شيئان مختلفان.','Sampling → positions | Quantization → levels','شبكة 4×4 تعني 16 موقعاً. عمق 8 بت يتيح 256 شدة لكل موقع.',[mc('تقليل القيم المسموحة من 256 إلى 16 مستوى يتعلق بماذا؟',['Quantization','Sampling','Rotation'],0,'تغير مجال الشدة، لا مواقع الشبكة.'),mc('تحديد شبكة الصفوف والأعمدة هو…',['Sampling','NOT','Classification'],0,'أخذ العينات مكانياً يحدد مواقع البكسلات.')])]},
{title:'وجوه الصورة الأربعة',en:'Image types',icon:'layers',world:0,source:'S06، S10-S11',lab:'types',recap:'الثنائية مستويان، الرمادية حزمة واحدة، RGB ثلاث حزم، ومتعددة الأطياف قد ترى خارج المرئي.',steps:[
C('binary','أسود أو أبيض فقط','Binary image','الصورة الثنائية لها قيمتان فقط: 0 و1، وتمثيلها المحزّم يحتاج 1 بت لكل بكسل. هذا لا يعني أن الصورة كلها مكونة من بكسلين.','1 bit → 2 levels','قد تحتوي الصورة مليون بكسل، لكن قيمة كل منها 0 أو1 فقط.',[mc('ما قيم الصورة الثنائية؟',['0 و1','من0 إلى255','RGB'],0,'ثنائية تعني وجود مستويين ممكنين للشدة.'),num('كم بتاً لكل بكسل في تمثيل ثنائي محزّم؟',1,'bit','بت واحد له حالتان:0 أو1.')]),
C('gray','بين الأسود والأبيض','Gray-scale image','الرمادية حزمة واحدة من شدات مختلفة. عند عمق 8 بت توجد 256 قيمة محتملة: 0 أسود، 255 أبيض، وبينهما تدرجات.','8 bits → 256 levels: 0…255','القيمة 127 درجة وسطية تقريباً؛ ليست أبيض كاملاً.',[num('ما أكبر قيمة رمادية غير موقّعة بعمق8 بت؟',255,'','256 مستوى تبدأ من0، لذلك آخرها255.'),mc('الصورة الرمادية المعتادة ذات8 بت تحتوي…',['حزمة واحدة و256 مستوى','256 حزمة','3 حزم RGB'],0,'عدد الحزم مختلف عن عدد مستويات الشدة.')]),
C('bands','قنوات أكثر، معلومات أكثر','RGB & Multispectral','RGB ثلاث حزم: أحمر وأخضر وأزرق. عند8 بت لكل حزمة يكون المجموع24 بت للبكسل. متعددة الأطياف تحتوي حزمًا أخرى، قد تكون خارج المرئي؛ ربطها بألوان العرض ينتج تركيباً لونياً.','RGB: 3 × 8 = 24 bits/pixel','في اللون الزائف قد نعرض حزمة تحت الحمراء باللون الأحمر. ورد النوع الرابع باسم Multi spatial في المصدر، لكن شرحه طيفي.',[num('RGB بثلاث قنوات، كل قناة8 بت. كم بتاً للبكسل؟',24,'bits','3×8=24.'),mc('عرض حزمة تحت الحمراء داخل القناة الحمراء مثال على…',['تركيب لوني زائف','صورة ثنائية','حذف بكسلات'],0,'نربط حزمة طيفية بلون عرض اختير لتمييز المعلومات.')])]},
{title:'خزنة البتات',en:'Bits & storage',icon:'chip',world:0,source:'S09، S14',lab:'storage',recap:'المستويات=2^b. التخزين=صفوف×أعمدة×بتات×حزم. البايت=8 بت.',steps:[
C('levels','كل بت يضاعف الاحتمالات','Gray levels','إذا كان عمق الشدة b بت، فعدد المستويات الممكنة 2 مرفوعة للأس b. القيم تبدأ من0 وتنتهي عند 2^b−1.','L = 2^b','3 بت →8 مستويات. 6 بت →64 مستوى، لا6 مستويات.',[num('عدد المستويات عند6 بت؟',64,'مستوى','2^6=64.'),num('عدد المستويات عند3 بت؟',8,'مستويات','2^3=8.')]),
C('bits','احسب البيانات الخام','Raw data size','اضرب عدد البكسلات في البتات لكل حزمة، ثم عدد الحزم. هذا حجم بيانات خام دون ضغط أو ترويسة. لا تستبدل6 بت بـ8 تلقائياً.','B(bits) = R × C × b × k','128×128، حزمة واحدة،6 بت: 98,304 بت. الصيغة العلمية لا تصغّر البيانات.',[num('صورة8×8، حزمة واحدة و6 بت. حجمها بالبت؟',384,'bits','8×8×6=384.'),num('صورة4×4 RGB، كل حزمة8 بت. كم بتاً؟',384,'bits','4×4×8×3=384.')]),
C('bytes','غيّر الوحدة، لا البيانات','Bits → Bytes → MiB','البايت8 بت. اقسم على8 لتحويل البتات إلى بايت. MiB تساوي 2^20 بايت، بينما MB العشرية تساوي مليون بايت.','bytes = bits/8 | MiB = bytes/1,048,576','512×512×8 بت =262,144 بايت =0.25 MiB. RGB بالحجم نفسه=0.75 MiB.',[num('384 بت تساوي كم بايتاً؟',48,'bytes','384÷8=48.'),num('صورة512×512،8 بت وحزمة واحدة. كم MiB؟',0.25,'MiB','كل بكسل بايت؛262,144÷1,048,576=0.25.',0.00001)])]},
{title:'راكب الموجة',en:'Light & spectrum',icon:'wave',world:0,source:'S01-S05؛ تصحيح الحد الأدنى للميكروي موثق في الدليل',lab:'spectrum',recap:'الطول الموجي والتردد عكسيان. المرئي400-700nm. فرّق بين IR المنعكس والحراري.',steps:[
C('wave','موجة أطول، تردد أقل','Wavelength & Frequency','λ المسافة بين قمتين. ν عدد الدورات في الثانية. عند ثبات سرعة الضوء: لو زاد أحدهما انخفض الآخر. حرك شريط الطول الموجي وشاهد الموجة.','c = λν | c ≈ 3×10^8 m/s','1 μm=10^-6m، و1nm=10^-9m، و1cm=10^-2m. إذا تضاعف λ انخفض ν للنصف.',[mc('إذا تضاعف الطول الموجي، فالتردد…',['يصبح نصفه','يتضاعف','لا يتغير'],0,'حاصل ضربهما ثابت: c=λν.'),num('إذا صار الطول الموجي4 أمثال قيمته، نقسم التردد على…',4,'','يتناسب التردد عكسياً مع الطول الموجي.')]),

C('ir','انعكاس أم انبعاث؟','Infrared & Atmosphere','في المذكرة: IR المنعكس0.7-3μm، والحراري3-100μm. الشمس مصدر مهم؛ الإشعاع يتأثر بالتشتت والامتصاص أثناء مروره بالغلاف الجوي.','Reflected IR ≠ Thermal IR','الميكروي تقريباً1mm-1m؛ ورد في الصورة1μm بالخطأ. الحراري منبعث من الأجسام، والمنعكس إشعاع انعكس عنها. المنشور يفصل الضوء الأبيض.',[mc('الإشعاع المنبعث من جسم بسبب حرارته يخص…',['تحت الأحمر الحراري','RGB فقط','الضوء المنعكس فقط'],0,'الحراري يتعلق بانبعاث الجسم، لا مجرد انعكاس ضوء الشمس.'),mc('ما التفاعلان المذكوران عند عبور الغلاف الجوي؟',['التشتت والامتصاص','التصنيف والتدوير','AND وOR'],0,'تغير الجزيئات والغازات مسار بعض الإشعاع أو تمتصه.')])]},

const QuestRules=(()=>{
 const normalize=s=>String(s).trim().replace(/[٠-٩]/g,c=>String('٠١٢٣٤٥٦٧٨٩'.indexOf(c))).replace(/[۰-۹]/g,c=>String('۰۱۲۳۴۵۶۷۸۹'.indexOf(c))).replace(/[٫،]/g,'.').replace(/−/g,'-').replace(/\s/g,'');
 function grade(q,value){
  if(q.type==='number'){const n=Number(normalize(value));return normalize(value)!==''&&Number.isFinite(n)&&Math.abs(n-q.answer)<=(q.tolerance||1e-8);}
  if(q.type==='order')return Array.isArray(value)&&value.length===q.answer.length&&value.every((v,i)=>v===q.answer[i]);
  return Number.isInteger(value)&&value===q.answer;
 }
 const shuffle=(a,seed)=>{const b=[...a];let s=seed>>>0;for(let i=b.length-1;i>0;i--){s=(s*1664525+1013904223)>>>0;const j=s%(i+1);[b[i],b[j]]=[b[j],b[i]];}return b;};
 function initial(){return {version:1,screen:'home',done:{},earned:{},weak:{},reflections:{},attempts:{},active:null,exam:null,sound:false,examRuns:0};}
 function clean(raw,levels){
  const base=initial();if(!raw||raw.version!==1)return base;
  const ids=new Set(levels.flatMap(l=>l.steps.map(s=>s.id)));
  for(const key of ['done','weak','reflections','attempts'])if(raw[key]&&typeof raw[key]==='object')for(const [id,v] of Object.entries(raw[key]))if(ids.has(id)||key==='reflections'&&/^level-\d+$/.test(id))base[key][id]=v;
  if(raw.earned&&typeof raw.earned==='object')for(const [id,v] of Object.entries(raw.earned))if((ids.has(id)&&v===30)||(/^exam-\d+$/.test(id)&&v===10))base.earned[id]=v;
  base.sound=raw.sound===true;base.examRuns=Number.isInteger(raw.examRuns)&&raw.examRuns>=0?raw.examRuns:0;
  if(raw.active&&Number.isInteger(raw.active.level)&&levels[raw.active.level]&&Number.isInteger(raw.active.step)&&levels[raw.active.level].steps[raw.active.step])base.active={...raw.active};
  if(raw.exam&&Array.isArray(raw.exam.items)&&raw.exam.items.length===levels.length&&Number.isInteger(raw.exam.index)&&raw.exam.index>=0&&raw.exam.index<=levels.length&&raw.exam.items.every(v=>levels[v.level]?.steps[v.step]?.questions[v.variant])&&Array.isArray(raw.exam.answers))base.exam=raw.exam;
  if(['home','lesson','review','rescue','exam','examResult'].includes(raw.screen))base.screen=raw.screen;
  if(base.screen==='lesson'&&!base.active)base.screen='home';if(['exam','examResult'].includes(base.screen)&&!base.exam)base.screen='home';
  return base;
 }
 const levelDone=(state,level)=>level.steps.every(s=>state.done[s.id]===true);
 const unlocked=(state,levels,i)=>i===0||levels.slice(0,i).every(l=>levelDone(state,l));
 return {normalize,grade,shuffle,initial,clean,levelDone,unlocked};
})();

function sound(good=true){if(!state.sound)return;try{ac??=new(window.AudioContext||window.webkitAudioContext)();ac.resume();[0,1].forEach(i=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=(good?520:240)*(i?1.3:1);g.gain.setValueAtTime(.0001,ac.currentTime+i*.09);g.gain.exponentialRampToValueAtTime(.04,ac.currentTime+i*.09+.01);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+i*.09+.14);o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+i*.09);o.stop(ac.currentTime+i*.09+.16);});}catch{}}

function home(){const done=completed(),pct=Math.round(Object.keys(state.done).filter(k=>state.done[k]).length/totalSteps*100);let next=LEVELS.findIndex(l=>!QuestRules.levelDone(state,l));if(next<0)next=15;const res=state.active?.phase!=='summary'&&state.active&&QuestRules.unlocked(state,LEVELS,state.active.level);return `<section class="hero"><div class="hero-content"><div class="eyebrow">LEARN IT. PLAY IT. OWN IT.</div><h1>${done===16?'الإشارة وصلت. اختبر فهمك.':'افهمها. جرّبها.<br>اكسب مستواك.'}</h1><p>حوّل معالجة الصور إلى مهمات صغيرة. فكرة واحدة، تجربة بيدك، ثم سؤال يثبت أنك فهمتها. بدون صفحات طويلة.</p><div class="actions"><button class="btn primary" data-action="${done===16?'examStart':res?'resume':'level'}" data-level="${next}">${icon('play')}${done===16?'ابدأ تحدي الإتقان':res?'كمّل من مكانك':done?'ابدأ المستوى التالي':'ابدأ أول مهمة'}</button><span class="small" style="color:#c8badb">${done?'رحلتك مستمرة، على مهلك':'3 أفكار قصيرة في كل مستوى'}</span></div></div><div class="hero-art"><div class="orbit"></div>${bot()}<span class="art-tag">+30 XP / IDEA</span></div></section><div class="metrics"><div class="metric"><div class="metric-icon">${icon('flag')}</div><div><strong>${done}<small class="small muted"> / 16</small></strong><span>مستوى مكتمل</span></div></div><div class="metric"><div class="metric-icon">${icon('star')}</div><div><strong>${pct}%</strong><span>من أفكار الرحلة</span></div></div><div class="metric"><div class="metric-icon">${icon('refresh')}</div><div><strong>${Object.keys(state.weak).length}</strong><span>فكرة تحتاج مراجعة</span></div></div></div><div class="section-head"><div><h2>خريطة الرحلة</h2><p>كل باب يُفتح بعد فهم الأفكار التي قبله.</p></div><span class="mode-tag">4 عوالم · 16 مستوى</span></div><div class="progressbar" role="progressbar" aria-label="تقدم الرحلة" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><span style="width:${pct}%"></span></div><div style="height:18px"></div>${WORLDS.map((w,wi)=>{const ls=LEVELS.map((l,i)=>({...l,index:i})).filter(l=>l.world===wi);return `<section class="world-card" style="--world:${w.color}"><div class="world-header"><div class="world-title"><span class="world-badge">${icon(['grid','zoom','calc','filter'][wi])}</span><div><h3>${w.name}</h3><span class="world-index">${w.en}</span></div></div><span class="small muted"><bdi>${ls.filter(l=>QuestRules.levelDone(state,l)).length} / 4</bdi></span></div><div class="level-cards">${ls.map(l=>{const ok=QuestRules.unlocked(state,LEVELS,l.index),finished=QuestRules.levelDone(state,l);return `<button class="level-tile ${finished?'complete':ok?'current':''}" data-action="level" data-level="${l.index}" ${ok?'':'disabled'}><span class="tile-top"><span class="tile-icon">${icon(l.icon)}</span><span class="tile-state">${finished?'✓ مكتمل':ok?'متاح':'مغلق'}</span></span><strong>${l.title}</strong><small>${l.en}</small></button>`;}).join('')}</div></section>`;}).join('')}<section class="exam-banner"><div><h3>تحدي الإتقان</h3><p>16 سؤالاً، سؤال من كل مستوى. سترى نقاط القوة وما يحتاج مراجعة.</p></div><button class="btn secondary" data-action="examStart" ${done===16?'':'disabled'}>${icon(done===16?'flag':'lock')}${done===16?'ابدأ التحدي':'أكمل المستويات لفتحه'}</button></section><div class="bottom-note"><div><strong>الغلط جزء من المهمة</strong>ستفهم سبب الخطأ، ثم تُختبر بسؤال آخر. الأفكار التي تعثرت فيها ترجع لاحقاً.</div><button class="btn text" data-action="navigate" data-target="rescue">افتح ورقة الإنقاذ</button></div>${footer()}`;}
function activeContext(){const a=state.active,l=LEVELS[a.level],s=l.steps[a.step];return {a,l,s,q:s.questions[(a.variant||0)%s.questions.length]};}

return `<div class="quiz-top">${icon('bolt')} ${a.exam?'تحدي الإتقان':a.mode==='review'?'استرجاع من الذاكرة':'وقت التجربة بنفسك'}</div><h2 class="quiz-question" id="screen-title" tabindex="-1">${rich(q.prompt)}</h2>${controls}${!feedback&&!a.exam?`<button class="hint-trigger" data-action="hint">${a.hint?'إخفاء الفكرة المساعدة':'أحتاج تلميحاً'}</button>${a.hint?`<div class="hint-box">${rich(LEVELS[a.level].steps[a.step].text)}</div>`:''}`:''}${feedback?`<div class="feedback ${feedback.pass?'':'bad'}" role="status"><h3>${feedback.pass?(a.exam?'إجابة صحيحة':a.mode==='review'?'ثبتت الفكرة':'تمام، وصلت الفكرة'):'خلّينا نفكّها خطوة خطوة'}</h3><p>${rich(q.why)}</p>${feedback.pass&&!a.exam&&a.mode!=='review'?`<p class="small" style="margin-top:8px;color:#b5df91">${state.earned[id]===30&&!feedback.already?'+30 XP':'فكرة مكتسبة · بدون نقاط مكررة'}</p>`:''}<div class="actions">${a.exam?`<button class="btn primary" data-action="examNext">${state.exam.index===15?'شوف النتيجة':'السؤال التالي'}</button>`:feedback.pass?`<button class="btn primary" data-action="${a.mode==='review'?'reviewNext':'next'}">${a.mode==='review'?'الفكرة التالية للمراجعة':a.step===2?'أكمل المستوى':'الفكرة التالية'}</button>`:`<button class="btn primary" data-action="retry">جرّب سؤالاً آخر</button><button class="btn secondary" data-action="relearn">ارجع للتجربة والشرح</button>`}</div></div>`:''}`;}
function levelSummary(a,l){const next=a.level+1;return `<section class="summary"><div class="success-ring">${icon('star')}</div><div class="eyebrow">LEVEL COMPLETE</div><h1>رفعت مستواك!</h1><span class="pill">${esc(l.title)} · 3 أفكار مكتسبة</span><div class="recap"><h3>ماذا تعلمت هنا؟</h3><p style="margin-top:12px">${rich(l.recap)}</p></div><div class="reflection"><label for="reflection">اشرح أهم فكرة بجملة بطريقتك <span class="muted">(اختياري)</span></label><textarea id="reflection" placeholder="مثلاً: الفرق بين قيمة البكسل وموقعه هو…">${esc(state.reflections['level-'+a.level]||'')}</textarea><p class="tiny muted">تُحفظ ملاحظتك لك؛ لا تُصحّح آلياً. قارنها بنفسك مع الخلاصة.</p></div><details><summary>قارن شرحك بالخلاصة</summary><p>${rich(l.recap)}</p></details><div class="actions"><button class="btn primary" data-action="${next<16?'level':'examStart'}" data-level="${next}">${next<16?'ابدأ المستوى التالي':'ادخل تحدي الإتقان'}</button><button class="btn secondary" data-action="navigate" data-target="home">ارجع للخريطة</button></div>${Object.keys(state.weak).length?`<p class="small muted" style="margin-top:20px">لديك ${Object.keys(state.weak).length} فكرة تحتاج استرجاعاً لاحقاً في «مراجعة أخطائي».</p>`:''}</section>`;}
function review(){const ids=Object.keys(state.weak);return `<div class="eyebrow">THE COMEBACK ROUND</div><h1>مراجعة أخطائي</h1><p class="muted" style="margin-top:13px">هذه أفكار تعثّرت فيها. استرجعها بسؤال مختلف؛ الإجابة الصحيحة تزيلها من القائمة.</p>${ids.length?`<div class="actions" style="margin:23px 0"><button class="btn primary" data-action="reviewStart" data-id="${ids[0]}">ابدأ جولة الاسترجاع</button></div>${ids.map(id=>{const {l,s,li}=findConcept(id);return `<article class="review-card"><div><h3>${esc(s.title)}</h3><p>المستوى ${li+1}: ${esc(l.title)} · أخطاء مسجلة: ${state.weak[id].count||1}</p></div><button class="btn secondary small-btn" data-action="reviewStart" data-id="${id}">راجع الفكرة</button></article>`;}).join('')}`:`<div class="empty">${icon('check')}<h2>لا أفكار معلّقة الآن</h2><p>حين تتعثر في سؤال، ستجد الفكرة هنا لمراجعتها لاحقاً. هذا يعكس أداءك في اللعبة، وليس ضماناً لدرجة الامتحان.</p><button class="btn primary" data-action="navigate" data-target="home">كمّل رحلتك</button></div>`}${footer()}`;}
function reviewQuestion(a,l,s,q){return `<div class="lesson-progress"><button class="back" data-action="navigate" data-target="review">قائمة المراجعة</button><span class="mode-tag">استرجاع فكرة سابقة</span></div><article class="mission" style="max-width:850px;margin:auto"><div class="mission-header"><span>${esc(s.title)}</span><span class="small muted">المستوى ${a.level+1}</span></div><div class="mission-body">${a.phase==='learn'?`<h2>${esc(s.title)}</h2><p class="lesson-text">${rich(s.text)}</p><div class="formula">${esc(s.formula)}</div><div id="lab">${labHTML(l.lab)}</div><details class="example"><summary>مثال وتوضيح</summary><p>${rich(s.example)}</p></details><div class="actions" style="margin-top:20px"><button class="btn primary" data-action="quiz">اختبرني من جديد</button></div>`:quizHTML(q,a,s.id)}</div></article>`;}
function rescue(){return `<div class="eyebrow">THE RESCUE SHEET</div><h1>ورقة الإنقاذ</h1><p class="muted" style="margin-top:12px">كل الأفكار والقواعد، متاحة للرجوع السريع. المسار التعليمي في الخريطة يظل خطوة بخطوة.</p><label class="sr-only" for="rescue-search">ابحث عن مصطلح</label><input id="rescue-search" class="rescue-search" placeholder="ابحث… مثل NOT، التخزين، العتبة" value="${esc(search)}"><div id="rescue-results">${rescueResults()}</div><div class="warning-note">تنبيهات المصدر: NOT ليس ضرباً في−1؛ تقليل الشدة لا يستخدم معاملاً سالباً؛ مجموع القناع1 لا يعني زيادة الإضاءة. الحدود والتقريب وحالة مساواة العتبة يجب تحديدها. بعض صفحات الأصل غير مرفقة، لذلك تغطي اللعبة المادة المستلمة فقط.</div><div class="inline-links"><a href="assets/study-guide.pdf" target="_blank" rel="noopener">الدليل المفصل بصيغةPDF</a><a href="assets/original-pages.pdf" target="_blank" rel="noopener">جميع الصور الأصلية المرتبة</a></div>${footer()}`;}
function rescueResults(){const query=search.trim().toLocaleLowerCase();return LEVELS.map((l,i)=>{const matches=!query||JSON.stringify(l).toLocaleLowerCase().includes(query);return matches?`<details class="rescue" ${query?'open':''}><summary>${i+1}. ${esc(l.title)} <span class="small muted">/ ${esc(l.en)}</span></summary><div class="rescue-content">${l.steps.map(s=>`<h3>${esc(s.title)} <bdi>${esc(s.en)}</bdi></h3><p class="lesson-text">${rich(s.text)}</p><div class="formula">${esc(s.formula)}</div><p class="small muted">${rich(s.example)}</p>`).join('')}<p class="tiny muted" style="margin-top:18px">المصدر: <bdi>${esc(l.source)}</bdi></p></div></details>`:''}).join('')||'<div class="empty"><h3>لم نجد هذا المصطلح</h3><p>جرّب كلمة عربية أو الاسم الإنجليزي.</p></div>';}
function exam(){const e=state.exam,item=e.items[e.index],l=LEVELS[item.level],s=l.steps[item.step],a={...item,phase:'quiz',exam:true,feedback:e.feedback,choice:e.choice,input:e.input,order:e.order},q=s.questions[item.variant];return `<div class="lesson-progress"><button class="back" data-action="navigate" data-target="home">اترك التحدي مؤقتاً</button><span class="small muted">${e.index+1} / 16</span></div><div class="exam-progress">${e.items.map((_,i)=>`<i class="${i<e.index?e.answers[i]?.pass?'pass':'fail':''}"></i>`).join('')}</div><article class="mission" style="max-width:850px;margin:auto"><div class="mission-header"><span class="mode-tag">تحدي الإتقان</span><span class="small muted">بدون تلميحات · لا يوجد وقت إجباري</span></div><div class="mission-body">${quizHTML(q,a,s.id)}</div></article>`;}
function examResult(){const e=state.exam,score=e.answers.filter(x=>x.pass).length;return `<section class="summary"><div class="success-ring">${icon(score===16?'star':'flag')}</div><div class="eyebrow">MISSION DEBRIEF</div><h1>${score===16?'إشارة واضحة!':'عرفنا أين نركز الآن'}</h1><div class="certificate">${score} / 16</div><p class="muted">هذه نتيجة جولة تدريبية من سؤال واحد لكل مستوى، وليست توقعاً لدرجة الامتحان.</p><div class="exam-score-items"><div><strong>${score}</strong><span>إجابة صحيحة</span></div><div><strong>${Object.keys(state.weak).length}</strong><span>فكرة في قائمة المراجعة</span></div></div><p class="recap">${score===16?'أكملت رحلة المفاهيم وأجبت عن هذه الجولة كاملة. راجع القوانين وأي أخطاء سابقة، ثم حاول شرح مثال جديد بنفسك.':'ابدأ بالأسئلة التي أخطأت فيها، ارجع للمختبر الخاص بها، ثم اختبر نفسك مرة أخرى.'}</p><div class="actions"><button class="btn primary" data-action="navigate" data-target="${Object.keys(state.weak).length?'review':'rescue'}">${Object.keys(state.weak).length?'راجع الأفكار المعلّقة':'افتح ورقة الإنقاذ'}</button><button class="btn secondary" data-action="examRestart">جولة جديدة</button><button class="btn text" data-action="navigate" data-target="home">خريطة الرحلة</button></div></section>`;}
function render(focus=false){let page=state.screen==='home'?home():state.screen==='lesson'?lesson():state.screen==='review'?review():state.screen==='rescue'?rescue():state.screen==='exam'?exam():examResult();$('#app').innerHTML=`${!storageOK?'<div class="storage-warning" role="status">التخزين المحلي غير متاح. ستعمل اللعبة، لكن تقدم هذه الجلسة قد لا يستمر بعد إغلاقها.</div>':''}<div class="shell">${sidebar()}<main class="main">${header()}<div class="container screen-enter">${page}</div></main></div>`;if(focus){window.scrollTo({top:0,behavior:'instant'});$('#screen-title')?.focus({preventScroll:true});}save();}
function findConcept(id){for(let li=0;li<LEVELS.length;li++){const si=LEVELS[li].steps.findIndex(s=>s.id===id);if(si>=0)return {l:LEVELS[li],s:LEVELS[li].steps[si],li,si};}return null;}
function enterLevel(i){if(!LEVELS[i]||!QuestRules.unlocked(state,LEVELS,i))return;state.active={level:i,step:0,phase:'learn',variant:0,mode:'learn'};state.screen='lesson';labKind='';mobileOpen=false;render(true);}
function enterReview(id){const found=findConcept(id);if(!found)return;const {li,si,s}=found;state.active={level:li,step:si,phase:'quiz',variant:((state.weak[id]?.variant||0)+1)%s.questions.length,mode:'review'};state.screen='lesson';labKind='';mobileOpen=false;render(true);}
function submit(value){const inExam=state.screen==='exam',e=state.exam,ctx=inExam?(()=>{const item=e.items[e.index];return {a:e,l:LEVELS[item.level],s:LEVELS[item.level].steps[item.step],q:LEVELS[item.level].steps[item.step].questions[item.variant],item};})():activeContext();const {a,q,s}=ctx;if(a.feedback)return;if(q.type==='number'&&QuestRules.normalize(value)===''){toast('اكتب رقماً أولاً');return;}if(q.type==='number'&&!Number.isFinite(Number(QuestRules.normalize(value)))){toast('اكتب رقماً صالحاً، مثل 4.5 أو −7');return;}const pass=QuestRules.grade(q,value);if(q.type==='mc')a.choice=value;if(q.type==='number')a.input=String(value);if(q.type==='order')a.order=[...value];const already=!!state.earned[s.id];a.feedback={pass,already};state.attempts[s.id]=(Number(state.attempts[s.id])||0)+1;if(!pass){const old=state.weak[s.id];state.weak[s.id]={count:(old?.count||0)+1,variant:inExam?ctx.item.variant:a.variant||0};}else if(inExam){const award='exam-'+ctx.item.level;if(!state.earned[award])state.earned[award]=10;}else if(a.mode==='review'){delete state.weak[s.id];}else{state.done[s.id]=true;if(!already)state.earned[s.id]=30;}if(inExam)e.answers[e.index]={pass,id:s.id};sound(pass);render();$('.feedback')?.scrollIntoView({block:'nearest',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});}
function startExam(force=false){if(completed()<16)return;if(force||!state.exam||state.exam.finished){state.examRuns++;state.exam={items:QuestRules.shuffle(LEVELS.map((l,i)=>({level:i,step:(i+state.examRuns-1)%3,variant:state.examRuns%2})),state.examRuns*947),index:0,answers:[],finished:false};}state.screen='exam';mobileOpen=false;render(true);}
function nextStep(){const a=state.active;if(!a.feedback?.pass)return;if(a.step<2){a.step++;a.phase='learn';a.variant=0;delete a.feedback;delete a.choice;delete a.input;delete a.order;a.hint=false;labKind='';render(true);}else{a.phase='summary';render(true);confetti();}}
function retry(){const {a,s}=activeContext();a.variant=((a.variant||0)+1)%s.questions.length;a.phase='quiz';delete a.feedback;delete a.choice;delete a.input;delete a.order;a.hint=false;render(true);}
function showReset(){const d=document.createElement('div');d.className='modal-backdrop';d.innerHTML=`<section class="modal" role="dialog" aria-modal="true" aria-labelledby="reset-title"><h2 id="reset-title">تبدأ الرحلة من جديد؟</h2><p>سيُحذف التقدم والنقاط وملاحظاتك من هذا المتصفح. يمكنك إعادة أي مستوى مكتمل دون حذف شيء.</p><div class="actions"><button class="btn secondary" data-action="cancelReset" autofocus>احتفظ بتقدمي</button><button class="btn primary" data-action="confirmReset">احذف وابدأ من جديد</button></div></section>`;document.body.append(d);modal=d;d.querySelector('[autofocus]').focus();}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;
 if(a==='navigate'){state.screen=b.dataset.target;mobileOpen=false;render(true);}
 else if(a==='menu'){mobileOpen=!mobileOpen;$('.sidebar')?.classList.toggle('open',mobileOpen);}
 else if(a==='sound'){state.sound=!state.sound;sound();render();}
 else if(a==='level')enterLevel(Number(b.dataset.level));
 else if(a==='resume'){state.screen='lesson';render(true);}
 else if(a==='quiz'){state.active.phase='quiz';delete state.active.feedback;delete state.active.choice;delete state.active.input;delete state.active.order;render(true);}
 else if(a==='choice')submit(Number(b.dataset.choice));
 else if(a==='hint'){state.active.hint=!state.active.hint;render();}
 else if(a==='next')nextStep();
 else if(a==='retry')retry();
 else if(a==='relearn'){state.active.phase='learn';state.active.variant=(state.active.variant||0)+1;delete state.active.feedback;delete state.active.input;delete state.active.choice;delete state.active.order;labKind='';render(true);}
 else if(a==='reviewStart')enterReview(b.dataset.id);
 else if(a==='reviewNext'){const ids=Object.keys(state.weak);if(ids.length)enterReview(ids[0]);else{state.screen='review';render(true);toast('تمت مراجعة جميع الأفكار المعلّقة');}}
 else if(a==='orderAdd'||a==='orderUndo'){const target=state.screen==='exam'?state.exam:state.active;if(target.feedback)return;const v=Number(b.dataset.choice);target.order??=[];if(a==='orderAdd'&&!target.order.includes(v))target.order.push(v);else if(a==='orderUndo')target.order=target.order.filter(x=>x!==v);render();}
 else if(a==='orderSubmit')submit((state.screen==='exam'?state.exam:state.active).order||[]);
 else if(a==='examStart')startExam();
 else if(a==='examRestart')startExam(true);
 else if(a==='examNext'){if(!state.exam.feedback)return;const ex=state.exam;if(ex.index===15){ex.finished=true;state.screen='examResult';render(true);if(ex.answers.every(x=>x.pass))confetti();}else{ex.index++;delete ex.feedback;delete ex.choice;delete ex.input;delete ex.order;render(true);}}
 else if(a==='resetDialog')showReset();
 else if(a==='cancelReset'){modal?.remove();modal=null;}
 else if(a==='confirmReset'){modal?.remove();modal=null;state=QuestRules.initial();labKind='';render(true);toast('رحلة جديدة، خطوة بخطوة');}
});
document.addEventListener('submit',e=>{if(e.target.id==='number-form'){e.preventDefault();submit(e.target.elements.answer.value);}});
document.addEventListener('input',e=>{if(e.target.id==='number-answer'){const a=state.screen==='exam'?state.exam:state.active;a.input=e.target.value;save();}if(e.target.id==='reflection'){state.reflections['level-'+state.active.level]=e.target.value.slice(0,3000);save();}if(e.target.id==='rescue-search'){search=e.target.value;$('#rescue-results').innerHTML=rescueResults();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(modal){modal.remove();modal=null;}else if(mobileOpen){mobileOpen=false;$('.sidebar')?.classList.remove('open');}}if(modal&&e.key==='Tab'){const list=[...modal.querySelectorAll('button')];if(e.shiftKey&&document.activeElement===list[0]){list.at(-1).focus();e.preventDefault();}else if(!e.shiftKey&&document.activeElement===list.at(-1)){list[0].focus();e.preventDefault();}}});

function matrixHTML(a,{hot=[],picked=[],click='',pixel=false,mini=false}={}){return `<div class="matrix ${pixel?'pixel-grid':''}" style="grid-template-columns:repeat(${a[0].length},1fr)">${a.flatMap((row,r)=>row.map((v,c)=>{const idx=r*a[0].length+c,attrs=click?`data-lab="${click}" data-index="${idx}" aria-label="صف${r+1}، عمود${c+1}، القيمة ${v}"`:'';return `<${click?'button':'span'} class="cell ${mini?'mini':''} ${hot.some(p=>p[0]===r&&p[1]===c)?'hot':''} ${picked.some(p=>p[0]===r&&p[1]===c)?'picked':''} ${click?'clickable':''}" ${pixel?`style="background:rgb(${v},${v},${v})"`:''} ${attrs}>${pixel?'':Number.isInteger(v)?v:Number(v.toFixed(3))}</${click?'button':'span'}>`;})).join('')}</div>`;}
const segment=(key,items,selected)=>`<div class="lab-control seg">${items.map(([value,label])=>`<button data-lab="set" data-key="${key}" data-value="${value}" class="${String(value)===String(selected)?'selected':''}" aria-pressed="${String(value)===String(selected)}">${label}</button>`).join('')}</div>`;
const selectControl=(key,label,values,value)=>`<div class="lab-control"><label for="lab-${key}">${label}</label><select id="lab-${key}" data-lab-input="${key}" style="padding:5px 10px;background:#282d42;border:1px solid #4c546e;color:#e2e4f1;font-size:14px">${values.map(v=>`<option value="${v}" ${v===value?'selected':''}>${v}</option>`).join('')}</select></div>`;
const rangeControl=(key,label,min,max,value)=>`<div class="lab-control"><label for="lab-${key}">${label}: <bdi data-live-value="${key}">${value}</bdi></label><input id="lab-${key}" type="range" min="${min}" max="${max}" value="${value}" data-lab-input="${key}"></div>`;
const SYSTEM=[['Digitizer','يحوّل إدخال الصورة إلى تمثيل رقمي.'],['Image processor','يجري العمليات الحسابية والمنطقية.'],['Computer','يدير البرنامج والعمليات.'],['Frame memory','تخزن إطار صورة رقمية كاملاً.'],['Display','يعرض الصورة للمستخدم.'],['Hard copy','يخرج نسخة مادية مطبوعة.']];
const STAGES=[['Acquisition','استحصال صورة بحساس أو كاميرا أو ماسح.'],['Preprocessing','تهيئة مثل إزالة الضوضاء.'],['Segmentation','فصل الجسم عن الخلفية.'],['Feature extraction','قياس صفات مثل اللون والشكل والحدود.'],['Classification','إسناد الجسم إلى فئة.'],['Understanding','فهم النتيجة وتفسيرها.']];
function initLab(kind){const step=state.active?.step||0,key=kind+'-'+(state.active?.level??0)+'-'+step;if(labKind===key)return;labKind=key;labState={pixel:0,values:[25,60,90,130,70,120,190,210,100,170,240,180,130,210,150,60],type:step===0?'binary':step===1?'gray':'rgb',n:128,b:6,channels:1,wavelength:520,stage:0,device:0,zoom:kind==='interpolate'?'linear':'repeat',k:2,r:1,c:1,operation:'add',factor:3,A:88,B:111,gate:'AND',row:3,col:2,dr:5,dc:3,angle:90,spike:50,kernel:'lap',mode:step===0?'threshold':step===1?'lowmask':'bins',threshold:15,value:10,width:8,reduce:step===0?'mean':step===1?'median':'sample'};}
function labHTML(kind){initLab(kind);return `<section class="lab ${kind==='convolution'?'lab-convolve':''}" aria-label="مختبر تفاعلي"><div class="lab-title"><span>${icon('grid')} مختبر صغير · جرّب بيدك</span><span>بدون نقاط أو تقييم</span></div><div id="lab-controls">${labControls(kind)}</div><div id="lab-live" aria-live="polite">${labVisual(kind)}</div></section>`;}
function labControls(kind){const s=labState;
 if(kind==='types')return segment('type',[['binary','ثنائية'],['gray','رمادية'],['rgb','RGB'],['multi','متعددة الأطياف']],s.type);
 if(kind==='storage')return selectControl('n','صفوف = أعمدة',[8,32,64,128,512],s.n)+selectControl('b','بتات لكل حزمة',[1,3,6,8],s.b)+selectControl('channels','عدد الحزم',[1,3],s.channels);
 if(kind==='spectrum')return rangeControl('wavelength','λ بالنانو متر',400,700,s.wavelength);
 if(kind==='pipeline'||kind==='system'){const arr=kind==='pipeline'?STAGES:SYSTEM,key=kind==='pipeline'?'stage':'device';return `<div class="system-buttons">${arr.map(([label],i)=>`<button data-lab="set" data-key="${key}" data-value="${i}" class="${s[key]===i?'selected':''}" aria-pressed="${s[key]===i}"><bdi>${label}</bdi></button>`).join('')}</div>`;}
 if(kind==='zoom'||kind==='interpolate')return segment('zoom',[['repeat','تكرار'],['linear','استيفاء']],s.zoom)+selectControl('k','المعامل K',[2,3,4],s.k);
 if(kind==='algebra')return segment('operation',[['add','جمع +'],['sub','طرح −'],['mul','ضرب ×K'],['div','قسمة ÷K']],s.operation)+selectControl('factor','المعامل K',[2,3,4],s.factor);
 if(kind==='logic')return segment('gate',[['AND','AND'],['OR','OR'],['NOT','NOT A']],s.gate);
 if(kind==='geometry')return `<div class="lab-control">${[['row','r',s.row],['col','c',s.col],['dr','r₀',s.dr],['dc','c₀',s.dc]].map(([k,t,v])=>`<label>${t} <input type="number" min="0" max="9" value="${v}" data-lab-input="${k}" aria-label="${k}"></label>`).join('')}</div>`+selectControl('angle','الزاوية',[0,90,180,270],s.angle);
 if(kind==='filters')return segment('spike',[[5,'مركز عادي: 5'],[50,'قيمة شاذة: 50']],s.spike);
 if(kind==='enhance')return segment('kernel',[['lap','تحسين عام'],['lap2','التحسين الثاني'],['diag0','قطري: مركز 0'],['diag1','قطري: مركز 1'],['vertical','عمودي'],['horizontal','أفقي'],['diag2','قطري ثانوي']],s.kernel);
 if(kind==='threshold')return segment('mode',[['threshold','العتبة'],['lowmask','أقل 3 بتات'],['bins','فئات متجاورة']],s.mode)+(s.mode==='threshold'?rangeControl('threshold','T',0,40,s.threshold):rangeControl('value','القيمة v',0,255,s.value))+(s.mode==='bins'?selectControl('width','عرض الفئة',[8,16],s.width):'');
 if(kind==='reduce')return segment('reduce',[['mean','متوسط كتلة'],['median','وسيط'],['sample','حذف دوري']],s.reduce);
 return '';
}

 if(kind==='logic'){const result=s.gate==='AND'?s.A&s.B:s.gate==='OR'?s.A|s.B:255-s.A;const bits=(value,label,click)=>`<div class="bit-row"><span class="bit-label">${label}</span>${value.toString(2).padStart(8,'0').split('').map((v,i)=>click?`<button class="bit ${v==='1'?'one':''}" data-lab="bit" data-key="${label}" data-index="${i}" aria-label="بت ${2**(7-i)} في ${label}، قيمته ${v}">${v}</button>`:`<span class="bit ${v==='1'?'one':''}">${v}</span>`).join('')}<span class="bit-label" style="width:37px">${value}</span></div>`;return `${bits(s.A,'A',true)}${s.gate==='NOT'?'':bits(s.B,'B',true)}${bits(result,'=',false)}<div class="lab-output"><bdi>${s.gate==='NOT'?`NOT₈(${s.A})`:`${s.A} ${s.gate} ${s.B}`} = ${result}</bdi></div><p class="lab-hint">اضغط بتاً في A أوB لتغييره. كل الأعداد هنا8 بت غير موقعة.</p>`;}
 if(kind==='geometry'){const θ=s.angle*Math.PI/180,r1=s.row+s.dr,c1=s.col+s.dc,r2=Math.round(r1*Math.cos(θ)+c1*Math.sin(θ)),c2=Math.round(-r1*Math.sin(θ)+c1*Math.cos(θ));return `<svg viewBox="0 0 220 220" style="height:180px;max-width:100%;display:block;margin:auto" aria-label="مواقع قبل النقل وبعد التدوير"><defs><pattern id="gp" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M14 0H0V14" fill="none" stroke="#303a51" stroke-width=".7"/></pattern></defs><rect width="220" height="220" fill="url(#gp)"/><path d="M0 110H220M110 0V220" stroke="#8792ab"/><circle cx="${110+s.col*7}" cy="${110+s.row*7}" r="5" fill="#68dccc"/><circle cx="${110+c1*7}" cy="${110+r1*7}" r="5" fill="#b6a0ff"/><circle cx="${110+c2*7}" cy="${110+r2*7}" r="6" fill="#c0f77c"/></svg><div class="lab-output"><bdi>(${s.row},${s.col}) → (${r1},${c1}) → (${r2},${c2})</bdi></div><p class="lab-hint">أزرق: الأصل · بنفسجي: بعد النقل · أخضر: بعد التدوير. المحور r إلى الأسفل.</p>`;}

function refreshLab(controls=false){const kind=state.active?LEVELS[state.active.level].lab:null;if(!kind||!$('#lab-live'))return;if(controls)$('#lab-controls').innerHTML=labControls(kind);$('#lab-live').innerHTML=labVisual(kind);document.querySelectorAll('[data-live-value]').forEach(el=>el.textContent=labState[el.dataset.liveValue]);}
